<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>고객 문의 처리 통계 v2 - 반복문 기반 리팩토링</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            color: #222;
        }

        h1 {
            margin-bottom: 12px;
        }

        p {
            margin: 4px 0;
        }

        table {
            border-collapse: collapse;
            margin-top: 24px;
            min-width: 980px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px 14px;
            text-align: right;
        }

        th {
            background: #f5f5f5;
            font-weight: 700;
        }

        th:first-child,
        td:first-child {
            text-align: left;
        }
    </style>
</head>
<body>
<h1>고객 문의 처리 통계 v2 - 반복문 기반 리팩토링</h1>
<p>이 화면은 v1과 동일하게 통계 셀마다 COUNT 쿼리를 개별 실행한다.</p>
<p>다만 Controller의 반복적인 model.addAttribute 호출을 제거하고, 통계 행과 열을 목록 기반으로 관리하도록 개선했다.</p>
<p>행 8개 × 컬럼 8개 = 최대 64회 COUNT 쿼리가 실행된다.</p>

<table>
    <thead>
    <tr>
        <th>구분</th>
        <th th:each="column : ${statTable.columns}" th:text="${column.label}">총계</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="row : ${statTable.rows}">
        <td th:text="${row.label}">전체</td>
        <td th:each="column : ${statTable.columns}"
            th:text="${row.counts[column.key]}">0</td>
    </tr>
    </tbody>
</table>
</body>
</html>
