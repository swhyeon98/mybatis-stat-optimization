spring.application.name=mybatis-stat-optimization

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stat_example?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:stat_user}
spring.datasource.password=${DB_PASSWORD:stat_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.mapper-locations=classpath*:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

spring.thymeleaf.cache=false

logging.level.com.example.stat.inquiry.mapper=trace
logging.level.org.mybatis=debug
logging.level.jdbc.sqlonly=debug

spring.sql.init.mode=always

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

app.sample-data.enabled=${SAMPLE_DATA_ENABLED:true}
app.sample-data.size=${SAMPLE_DATA_SIZE:3200}
